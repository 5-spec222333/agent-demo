<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Agent 驱动的广告素材生产平台交互演示" />
  <title>Agent 广告素材生产平台 Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">A</span>
        <div><strong>增长素材 Agent</strong><span>广告素材生产平台</span></div>
      </div>
      <nav id="main-nav"></nav>
      <div class="sidebar-note">
        <span class="eyebrow">演示边界</span>
        <p>通用电商 Mock 场景，不代表任何真实平台内部系统或规则。</p>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div>
          <p class="eyebrow">贯穿场景</p>
          <h1 id="page-title">夏季女装拉新视频</h1>
        </div>
        <div class="topbar-actions">
          <div class="case-progress" id="case-progress" aria-label="演示进度"></div>
          <button class="button button-ghost" id="reset-demo" type="button">重置演示</button>
        </div>
      </header>

      <main id="workspace" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="detail-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true" hidden>
    <div class="drawer-header">
      <div><p class="eyebrow" id="drawer-eyebrow">详情</p><h2 id="drawer-title">详情</h2></div>
      <button class="icon-button" id="close-drawer" type="button" aria-label="关闭详情">×</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="sr-only" id="live-region" aria-live="polite"></div>

  <script src="data/mock-data.js"></script>
  <script src="data/scenario.js"></script>
  <script src="state-machine.js"></script>
  <script src="components/ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
